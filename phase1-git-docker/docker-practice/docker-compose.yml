services:
  # 유일한 출입구. 외부에서 들어올 수 있는 포트는 이제 8080 하나뿐이다.
  nginx:
    image: nginx:1.29-alpine
    ports:
      - "8080:80"
    volumes:
      # 내 설정 파일을 컨테이너 안 nginx 기본 설정 자리에 덮어씌운다.
      # ro = read only. 컨테이너가 이 파일을 고치지 못하게 막는다.
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

  api:
    build: .
    # ports 를 지웠다. 이제 호스트에서 localhost:8000 으로 직접 못 들어온다.
    # 대신 같은 compose 네트워크 안의 nginx는 api:8000 으로 자유롭게 접근할 수 있다.
    environment:
      APP_ENV: docker-compose
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata: