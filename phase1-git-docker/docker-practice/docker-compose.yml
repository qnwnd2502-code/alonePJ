services:
  # 유일한 출입구. 외부에서 들어올 수 있는 포트는 이제 8080 하나뿐이다.
  nginx:
    image: nginx:1.29-alpine
    ports:
      - "8080:80"     # http — 이제 일을 안 하고 https 로 돌려보내기만 한다
      - "8443:443"    # https — 진짜 출입구
    volumes:
      # 내 설정 파일을 컨테이너 안 nginx 기본 설정 자리에 덮어씌운다.
      # ro = read only. 컨테이너가 이 파일을 고치지 못하게 막는다.
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # 인증서와 개인키. ro 가 여기서는 특히 중요하다 — 개인키는 읽히기만 하면 된다.
      # 이미지 안에 인증서를 굽지 않고 밖에서 넣는 이유: 갱신할 때 파일만 바꿔 끼우면 되고,
      # 비밀키가 이미지에 박혀 레지스트리에 올라가는 사고를 막는다.
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api

  api:
    build: .
    # ports 를 지웠다. 이제 호스트에서 localhost:8000 으로 직접 못 들어온다.
    # 대신 같은 compose 네트워크 안의 nginx는 api:8000 으로 자유롭게 접근할 수 있다.
    environment:
      APP_ENV: docker-compose
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # 세션을 보관할 곳. 이 한 줄이 '서버 안의 기억'을 '서버 밖의 기억'으로 옮긴다.
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 세션 창고. api 3대가 이 한 곳을 같이 본다.
  redis:
    image: redis:8-alpine
    # ports 를 일부러 두지 않는다. Redis는 기본값에 비밀번호가 없어서
    # 외부에 노출되면 세션을 통째로 읽히고 남의 계정으로 로그인당한다.
    # (실무에서 인터넷에 열린 Redis가 털리는 사고가 흔하다)
    healthcheck:
      # redis-cli ping 을 던져 PONG 이 오면 살아있는 것으로 본다
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata: