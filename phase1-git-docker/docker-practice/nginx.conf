worker_processes  1;

events {
    worker_connections  1024;
}

http {
    # 클라이언트 -> nginx -> 어느 백엔드로 갔는지가 한 줄에 보이도록 직접 정의한 로그 형식.
    # $upstream_addr 가 실제로 응답한 컨테이너의 IP:포트라서, 로드밸런싱을 눈으로 확인할 수 있다.
    log_format study '[$time_local] client=$remote_addr -> backend=$upstream_addr  "$request"  status=$status';

    # 파일이 아니라 표준출력으로 보낸다 -> `docker compose logs nginx` 로 바로 읽힌다.
    # 컨테이너 안에 로그 파일을 쌓아두면 컨테이너가 사라질 때 같이 사라진다.
    access_log  /dev/stdout study;
    error_log   /dev/stderr warn;

    # 백엔드 그룹. arch-lab에서는 127.0.0.1:8003, 8004 처럼 IP와 포트를 손으로 적었지만,
    # 여기서는 compose의 '서비스 이름' 하나만 적는다.
    # Docker 내부 DNS가 api -> 컨테이너 IP 로 바꿔주고,
    # 복제본이 여러 개면 IP를 여러 개 돌려준다. nginx는 그걸 전부 등록해 round robin 한다.
    upstream api_pool {
        # ip_hash 를 뺐다. 세션을 Redis로 옮겨서 api가 무상태가 됐기 때문에,
        # 이제 어느 서버가 요청을 받아도 결과가 같다 -> 고정할 이유가 없다.
        # (ip_hash 는 응급처치였다: 서버가 죽으면 그 사용자만 로그아웃되고,
        #  같은 공인 IP를 쓰는 기관 수백 명이 한 대로 몰렸다)
        server api:8000;
    }

    # ── 80(http) 로 들어온 요청은 일 처리를 하지 않고 https 로 돌려보낸다. ──
    # 사용자는 주소창에 https:// 를 안 친다. 그래서 http 문을 닫아버리면
    # "사이트가 안 된다"는 민원이 되고, 열어두면 평문으로 로그인하는 사람이 생긴다.
    # 답은 '닫는 것'이 아니라 '보내는 것'이다.
    #
    # 주의: 이 블록은 '들어온 모든 것'을 돌려보낸다. 실무에서는 예외를 빼야 할 때가 있다.
    # L4 스위치/로드밸런서는 보통 http로 헬스체크를 던지고 200만 정상으로 보는데,
    # 301을 받으면 멀쩡한 서버를 죽은 걸로 판단해 서비스에서 빼버린다.
    # (인증서 갱신용 경로 /.well-known/acme-challenge 도 같은 이유로 예외 처리한다)
    server {
        listen       80;
        server_name  localhost;

        # 301 = 영구 이동. 브라우저가 이걸 기억해서 다음부터는 아예 https로 먼저 온다.
        # (302 = 임시. 기억 안 함. 잘못 쓰면 매번 왕복이 한 번씩 더 생긴다)
        #
        # 주소를 $host 로 쓰지 않고 손으로 박은 이유 (중요):
        # $host 는 '요청자가 보낸 Host 헤더'다. 즉 공격자가 마음대로 정할 수 있다.
        #   Host: evil.com  ->  우리 서버가 https://evil.com 으로 친절히 보내준다
        # 링크 앞부분이 진짜 기관 도메인이라 사용자가 믿고 누르게 되는 피싱 수법이고,
        # 이름은 '오픈 리다이렉트'. 보안점검 단골 지적사항이다.
        # 보낼 곳은 반드시 우리가 정한다.
        #
        # :8443 이 붙은 건 실습이라 표준 포트(443)를 못 써서다. 운영에서는 포트를 뺀다.
        return 301 https://localhost:8443$request_uri;
    }

    # ── 443(https). 실제 일은 전부 여기서 한다. ──
    server {
        # ssl 을 붙여야 nginx가 "이 포트로 오는 건 암호화된 것"으로 취급한다.
        listen       443 ssl;
        server_name  localhost;

        # 신분증과 도장. 경로는 컨테이너 안 기준이다(볼륨으로 넣어준다).
        ssl_certificate     /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;
        # Apache 로 치면 SSLCertificateFile / SSLCertificateKeyFile 과 같은 자리다.

        # 낡은 버전을 명시적으로 잘라낸다. TLS 1.0/1.1 은 알려진 취약점이 있고,
        # 공공기관 보안 점검에서 "구버전 프로토콜 비활성화"로 반드시 걸리는 항목이다.
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;   # 요즘은 클라이언트 선호를 따르는 쪽이 권장된다

        # 악수(handshake)는 비싸다. 한 번 맺은 결과를 캐싱해 재접속을 싸게 만든다.
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # HSTS: "이 도메인은 앞으로 https 로만 접속해라"를 브라우저에 각인시킨다.
        # 켜면 브라우저가 기억해버려서 http 로 되돌릴 수 없다 -> 자체서명 실습에서는 위험.
        # 운영에 진짜 인증서를 붙인 뒤에 켠다.
        # add_header Strict-Transport-Security "max-age=31536000" always;

        # nginx 자신이 살아있는지만 확인하는 경로. 백엔드까지 안 간다.
        # 장애 시 "nginx가 죽었나, 백엔드가 죽었나"를 가르는 데 쓴다.
        location /nginx-ping {
            return 200 "pong from nginx\n";
        }

        location / {
            # 여기가 http:// 인 게 오타가 아니다. 암호는 nginx에서 끝난다(TLS 종료).
            # 브라우저~nginx 구간만 암호화되고, nginx~api 구간은 평문이다.
            # 도커 내부망이라 그래도 되는 것이고, 실무에서 WAS가 http 8009/8080 인 이유도 같다.
            # (구간까지 전부 암호화하는 건 mTLS/서비스메시 영역 — 훨씬 뒤 이야기)
            proxy_pass http://api_pool;

            # 백엔드가 이 시간 안에 응답하지 않으면 nginx가 기다리기를 포기하고 504를 돌려준다.
            # 기본값은 60초. 실무에서는 이게 너무 길어서, 사용자가 먼저 새로고침을 눌러버린다.
            # 여기서는 실습을 위해 5초로 줄인다.
            proxy_connect_timeout 3s;   # 연결 자체를 맺는 데 걸리는 시간
            proxy_read_timeout    5s;   # 연결 후 응답을 기다리는 시간  <- 504는 주로 이것

            # 프록시를 거치면 백엔드는 '누가 원래 요청했는지'를 잃어버린다.
            # 백엔드 입장에서 접속자는 전부 nginx로 보이기 때문에, 아래 헤더로 원본 정보를 실어 보낸다.
            proxy_set_header Host              $host;                            # 원래 요청한 도메인
            proxy_set_header X-Real-IP         $remote_addr;                     # 진짜 클라이언트 IP
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;       # 거쳐온 프록시 목록(누적)
            # 아래 한 줄이 오늘부로 진짜 의미를 갖는다. api는 자기가 http로 요청받았다고 믿기 때문에,
            # 이 헤더가 없으면 "너 http네? https로 가"라고 리다이렉트를 걸고 -> nginx가 다시 평문으로 넘기고
            # -> 무한 반복. 현업 단골 장애인 '리다이렉트 루프'가 대부분 이 헤더 누락이다.
            proxy_set_header X-Forwarded-Proto $scheme;                          # http / https 중 무엇이었는지
        }
    }
}
