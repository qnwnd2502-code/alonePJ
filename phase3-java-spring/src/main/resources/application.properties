# application.properties = 이 앱의 설정 파일.
# 회사(전자정부프레임워크)의 각종 .properties / .xml 설정과 같은 자리다.
# 코드를 고치지 않고 동작만 바꾸고 싶을 때 쓴다.

# 스프링이 만든 '주소록'을 켤 때 화면에 찍어달라는 설정.
# 평소에는 켜지 않는다(로그가 많아진다). 지금은 눈으로 보려고 켠다.
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE

# 요청 하나가 안내데스크를 거쳐 어디로 갔는지 추적한다.
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG

# ────────────────────────────────────────────────────────────
#  DB 접속 정보 (2026-08-25 추가)
#  ${DB_URL} 은 docker-compose.yml 의 environment 로 들어온 값을 읽는다.
#  비밀번호를 이 파일에 직접 쓰지 않는 이유: 이 파일은 git 에 올라가기 때문이다.
#  회사에서도 운영 비밀번호는 이 파일에 없다(서버 환경변수나 별도 설정으로 넣는다).
# ────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# MyBatis 가 XML(SQL 파일)을 어디서 찾을지 알려준다.
# classpath = src/main/resources 안쪽을 뜻한다. **/ 는 하위 폴더 전부.
mybatis.mapper-locations=classpath:mapper/**/*.xml

# DB 컬럼 use_yn(밑줄) 을 자바 필드 useYn(낙타등) 으로 자동 변환해준다.
# 이게 없으면 vo.getUseYn() 이 계속 null 이다. 실무에서 자주 밟는 함정.
mybatis.configuration.map-underscore-to-camel-case=true

# 실행된 SQL 과 파라미터, 결과 건수를 로그에 찍는다.
# 회사에서 'SQL 이 왜 결과가 안 나오지' 를 잡을 때 가장 먼저 켜는 설정이다.
logging.level.com.study.MemberMapper=TRACE
