# application.properties = 이 앱의 설정 파일.
# 회사(전자정부프레임워크)의 각종 .properties / .xml 설정과 같은 자리다.
# 코드를 고치지 않고 동작만 바꾸고 싶을 때 쓴다.

# 스프링이 만든 '주소록'을 켤 때 화면에 찍어달라는 설정.
# 평소에는 켜지 않는다(로그가 많아진다). 지금은 눈으로 보려고 켠다.
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE

# 요청 하나가 안내데스크를 거쳐 어디로 갔는지 추적한다.
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
