services:
  # 자바를 PC에 설치하지 않는다. JDK와 Maven이 통째로 들어있는 이미지를 빌린다.
  # Phase 2에서 openssl 을 컨테이너로 빌려 쓴 것과 같은 수법이다.
  boot:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /app
    # -B = batch mode. 진행률 막대 같은 쓰레기 출력을 끈다(로그가 읽히게).
    command: mvn -B spring-boot:run
    ports:
      # 왼쪽이 내 PC, 오른쪽이 컨테이너 안.
      # 8080/8443(Phase 1), 9080(Phase 2)을 이미 쓰고 있어서 9090으로 뺐었다.
      # 2026-08-24: 윈도우가 재부팅 때 8995~9094 를 예약해버려서 9090 바인딩 실패.
      #   "ports are not available ... An attempt was made to access a socket in a way forbidden"
      #   확인: netsh interface ipv4 show excludedportrange protocol=tcp
      #   -> 예약 구간 밖인 9500 으로 옮김
      - "9500:8080"
    volumes:
      - ./:/app
      # 이게 없으면 컨테이너를 껐다 켤 때마다 라이브러리를 처음부터 다시 받는다(매번 3~5분).
      # 받아둔 걸 도커 볼륨에 쌓아두고 재사용한다. 회사 PC의 C:\Users\...\.m2 폴더와 같은 역할.
      - m2:/root/.m2
    # DB 접속 정보를 코드에 박지 않고 환경변수로 넣는다.
    # application.properties 가 ${DB_URL} 로 이 값을 받아 쓴다.
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    # db 가 '떴다' 가 아니라 '접속 받을 준비가 됐다' 까지 기다린다.
    # 이게 없으면 부트가 먼저 떠서 접속 실패로 죽는다.
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    # ports 를 일부러 두지 않는다. DB를 내 PC 포트로 노출할 이유가 없다.
    # 같은 compose 네트워크 안의 boot 는 db:5432 로 자유롭게 접근한다.
    # DB 안을 들여다볼 때는 컨테이너 안으로 들어간다:
    #   docker compose exec db psql -U study -d studydb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # 데이터를 볼륨에 저장한다. 컨테이너를 지워도 데이터는 남는다.
      - pgdata:/var/lib/postgresql/data
      # 이 폴더의 .sql 은 DB가 '처음 만들어질 때' 한 번만 자동 실행된다.
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # pg_isready = "접속 받을 준비 됐냐" 를 묻는 postgres 전용 명령
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  m2:
  pgdata:
