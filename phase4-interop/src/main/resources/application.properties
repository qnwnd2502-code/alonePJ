spring.application.name=interop

# 상대 기관 정보. 소스가 아니라 여기(그리고 환경변수)에 둔다.
partner.base-url=${PARTNER_BASE_URL:http://localhost:8000}
partner.api-key=${PARTNER_API_KEY:없음}
# ★ 오늘 추가. 같은 상대 기관의 https 주소 (웹서버를 거친다)
partner.tls-base-url=${PARTNER_TLS_BASE_URL:https://localhost:8443}

# ============================================================
#  ★ SSL 번들 — "우리가 믿는 CA 목록" 을 스프링에 등록하는 곳
#
#  이름 규칙을 뜯어보면:
#    spring.ssl.bundle.jks.[번들이름].truststore.xxx
#                          └───┬───┘
#                     우리가 지은 이름. 'partner' 라고 지었다.
#                     이 이름을 자바 코드에서 getBundle("partner") 로 꺼낸다.
#
#  ★ truststore = 남을 검증하는 곳 (공개 인증서만 들어 있다)
#    keystore   = 나를 증명하는 곳 (개인키가 들어 있다)  <- 2단계에서 추가
# ============================================================

# 이 비밀번호는 DB 비밀번호와 성격이 다르다.
# truststore 안에는 '공개' 인증서만 있어서 숨길 내용이 없다.
# 이 비밀번호는 '내용을 숨기려고' 가 아니라 '누가 몰래 CA 를 끼워넣지 못하게'
# 무결성을 지키는 용도다. 그래서 changeit 이라는 관례 값을 그대로 쓴다.
# (반면 spring.datasource.password 는 절대 이렇게 쓰면 안 된다)

#연계기관을 검증
spring.ssl.bundle.jks.partner.truststore.location=file:/app/certs/truststore.p12
#나를 검증
spring.ssl.bundle.jks.partner.keystore.location=file:/app/certs/keystore.p12

spring.ssl.bundle.jks.partner.truststore.type=PKCS12
spring.ssl.bundle.jks.partner.keystore.type=PKCS12

spring.ssl.bundle.jks.partner.truststore.password=changeit
spring.ssl.bundle.jks.partner.keystore.password=changeit




# 나가는 요청을 로그로 보기 위한 설정 (오늘 실습에서 씀)
logging.level.com.study.interop=DEBUG

# ============================================================
#  ★ 상대 기관 DB 에 '직접' 접속하는 설정 (연계 3형태 중 3번)
#
#  주목: 우리 설정 파일에 '남의 DB 주소' 가 박힌다.
#        이게 곧 결합(coupling)이다. 상대 DB 가 죽으면 우리도 못 뜬다.
#  비밀번호는 절대 여기 직접 쓰지 않는다. 환경변수로 주입한다.
# ============================================================
spring.datasource.url=${PARTNER_DB_URL:jdbc:postgresql://localhost:5432/partnerdb}
spring.datasource.username=${PARTNER_DB_USER:none}
spring.datasource.password=${PARTNER_DB_PASSWORD:none}
