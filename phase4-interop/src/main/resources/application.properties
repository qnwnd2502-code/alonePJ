spring.application.name=interop

# 상대 기관 정보. 소스가 아니라 여기(그리고 환경변수)에 둔다.
partner.base-url=${PARTNER_BASE_URL:http://localhost:8000}
partner.api-key=${PARTNER_API_KEY:없음}

# 나가는 요청을 로그로 보기 위한 설정 (오늘 실습에서 씀)
logging.level.com.study.interop=DEBUG

# ============================================================
#  ★ 상대 기관 DB 에 '직접' 접속하는 설정 (연계 3형태 중 3번)
#
#  주목: 우리 설정 파일에 '남의 DB 주소' 가 박힌다.
#        이게 곧 결합(coupling)이다. 상대 DB 가 죽으면 우리도 못 뜬다.
#  비밀번호는 절대 여기 직접 쓰지 않는다. 환경변수로 주입한다.
# ============================================================
spring.datasource.url=${PARTNER_DB_URL:jdbc:postgresql://localhost:5432/partnerdb}
spring.datasource.username=${PARTNER_DB_USER:none}
spring.datasource.password=${PARTNER_DB_PASSWORD:none}
