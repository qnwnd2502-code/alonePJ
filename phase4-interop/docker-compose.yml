services:
  # ============ 우리 시스템 (연계를 '하는' 쪽) ============
  boot:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /app
    command: mvn -B spring-boot:run
    ports:
      # 9500 은 Phase 3 이 쓰므로 9600 으로. (8995~9094 는 윈도우 예약 구간이라 피한다)
      - "9600:8080"
    volumes:
      - ./:/app
      - m2:/root/.m2
    environment:
      # ★ 상대 기관이 발급해준 키. 소스에 박지 않고 환경변수로 주입한다.
      #   실제로는 이 값도 .env 로 빼야 하지만, 학습용 더미라 여기 둔다.
      PARTNER_API_KEY: eGov-DEMO-KEY-2026-abcdef123456
      # 상대 기관 주소. 개발계/운영계가 다르므로 반드시 설정으로 뺀다.
      PARTNER_BASE_URL: http://partner:8000
      # ★ 오늘 추가. 같은 상대 기관인데 '웹서버를 거쳐 https 로' 들어가는 주소.
      #   http 주소와 나란히 두고 무엇이 달라지는지 비교한다.
      PARTNER_TLS_BASE_URL: https://partner-gw:8443
      # ★ 전문 위·변조 방지용 공유 비밀키. 아래 partner 에도 '같은 값' 이 들어간다.
      #   양쪽이 같아야 서명이 맞는다(대칭). .env 에서 온다.
      HMAC_SECRET: ${HMAC_SECRET}
      # OAuth2 자격증명. 이걸로 토큰을 받는다.
      PARTNER_CLIENT_SECRET: ${PARTNER_CLIENT_SECRET}
      # ★ 상대 기관 DB 에 직접 붙는 정보. 상대가 우리에게 발급해준 계정이다.
      #   보통 '읽기 전용' 계정을 준다(줘야 한다).
      PARTNER_DB_URL: jdbc:postgresql://partner-db:5432/${PARTNER_DB_NAME}
      PARTNER_DB_USER: ${PARTNER_DB_USER}
      PARTNER_DB_PASSWORD: ${PARTNER_DB_PASSWORD}
      # ★ 실습 7. 상대 기관 SFTP 접속정보. 주소가 '호스트:포트' 라는 것에 주의.
      #   HTTP 연계와 달리 URL 이 아니다. 방화벽 신청서에도 이 형태로 적는다.
      SFTP_HOST: partner-sftp
      SFTP_PORT: "22"
      SFTP_USER: ${SFTP_USER}
      SFTP_PASSWORD: ${SFTP_PASSWORD}
    # depends_on 은 목록형(- partner)과 조건형을 섞어 쓸 수 없다. 전부 조건형으로 통일한다.
    depends_on:
      partner:
        condition: service_started
      partner-gw:
        condition: service_started
      partner-db:
        condition: service_healthy
      partner-sftp:
        condition: service_started

  # ============ 상대 기관 서버 (연계를 '당하는' 쪽) ============
  # 회사에서는 이 컨테이너가 없다. 상대 기관 전산실에 있다.
  # 학습용으로 양쪽을 다 띄워놓고 본다.
  partner:
    build: ./partner
    # ports 를 일부러 두지 않는다. 우리는 브라우저가 아니라
    # '자바 코드'로 부르는 연습을 해야 한다. boot 는 partner:8000 으로 접근한다.
    environment:
      PARTNER_API_KEY: eGov-DEMO-KEY-2026-abcdef123456
      # ★ 우리 boot 와 '같은 값'. 이게 다르면 서명이 안 맞는다.
      HMAC_SECRET: ${HMAC_SECRET}
      PARTNER_CLIENT_SECRET: ${PARTNER_CLIENT_SECRET}
      # ★ HS256 서명용. 우리에게도 이 값을 줘야 검증이 된다 = HS256 의 근본 문제.
      #   (RS256 은 공개키만 주면 되므로 이런 공유가 필요 없다)
      JWT_HS_SECRET: ${JWT_HS_SECRET}
    volumes:
      # ★ 상대 기관의 '야간 배치'가 파일을 떨구는 자리.
      #   아래 partner-sftp 가 같은 볼륨을 자기 홈으로 물고 있다.
      #   즉 파일을 만드는 놈과 내보내는 놈이 다르다 — 실무도 대개 이 구조다.
      - sftpdata:/data/outbox

  # ============ 상대 기관의 웹서버 (TLS 종료 지점) ============
  # 상대 기관 전산실 맨 앞에 서 있는 nginx 다. 우리 것이 아니다.
  # 인증서를 들고 있는 건 앱이 아니라 '이 녀석' 이다.
  partner-gw:
    image: nginx:1.27-alpine
    ports:
      # 브라우저로도 열어보기 위해 노출한다.
      # (앱 서버는 노출 금지지만 웹서버는 원래 외부에 서는 자리다)
      - "8443:8443"
    volumes:
      - ./partner-gw/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # ★ 인증서를 이미지 안에 굽지 않는다. 볼륨으로 '읽기 전용' 마운트한다.
      #   이미지에 개인키를 구우면 레지스트리에 올리는 순간 유출이다.
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      partner:
        condition: service_started

  # ============ 상대 기관의 DB ============
  # 상대 기관 전산실 안에 있는 DB 다. 20년째 쓰고 있고 우리가 만든 게 아니다.
  # 우리가 여기에 '직접' 붙는 것이 연계 3형태 중 3번이다.
  partner-db:
    image: postgres:17
    # ports 를 두지 않는다. 컨테이너 네트워크 안에서만 접근한다.
    environment:
      POSTGRES_USER: ${PARTNER_DB_USER}
      POSTGRES_PASSWORD: ${PARTNER_DB_PASSWORD}
      POSTGRES_DB: ${PARTNER_DB_NAME}
    volumes:
      - partnerdata:/var/lib/postgresql/data
      - ./partner/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PARTNER_DB_USER} -d ${PARTNER_DB_NAME}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ============ 상대 기관의 SFTP 서버 ============
  # 연계 3형태(API/파일/DB) 중 '파일' 이다. 공공 연계의 절반 이상이 아직 여기 있다.
  # 밤에 상대가 파일을 떨궈두면, 아침에 우리가 가져가서 우리 DB 에 적재한다.
  partner-sftp:
    image: atmoz/sftp:alpine
    # 형식 = 계정:비밀번호:UID:GID  (공문으로 받는 그 계정이다)
    # ※ 아래 볼륨 경로의 'eaiuser' 는 .env 의 SFTP_USER 와 같아야 한다.
    command: ${SFTP_USER}:${SFTP_PASSWORD}:1001:1001
    # ★ ports 를 두지 않는다. 22 번을 호스트에 여는 건 그 자체로 사고다.
    #   우리는 컨테이너 네트워크 안에서 partner-sftp:22 로만 붙는다.
    #   (안을 들여다볼 땐 docker compose exec 를 쓴다)
    volumes:
      - sftpdata:/home/eaiuser/outbox

volumes:
  m2:
  partnerdata:
  # 상대 기관 배치가 쓰고, 상대 기관 SFTP 가 내보내는 같은 디스크
  sftpdata:
