# ============================================================
#  상대 기관의 '웹서버' 다. 우리 것이 아니다.
#
#  실무에서 상대 기관 앱(FastAPI/톰캣)이 직접 TLS 를 처리하는 경우는 드물다.
#  앞단에 nginx/Apache 가 서서 인증서를 들고 있고, 뒷단 앱은 평문으로 받는다.
#  이 nginx 가 바로 'TLS 종료 지점(termination point)' 이다.
#
#      [우리] --- https(암호화) ---> [여기서 풀림] --- http(평문) ---> [앱]
#
#  ★ 그래서 "TLS 를 썼으니 끝에서 끝까지 안전하다" 는 말은 틀렸다.
#    여기서부터 뒤는 평문이다. (Phase 4 1일차에서 API Key 가 5곳에 남는다고 한 이유)
# ============================================================

server {
    # 443 대신 8443. 컨테이너라 특권 포트를 피한다.
    listen 8443 ssl;
    server_name partner-gw;

    # ---------- ① 서버 신분증 (상대 기관이 자기를 증명하는 것) ----------
    # .crt = 남에게 보여주는 신분증  /  .key = 절대 안 주는 비밀값
    ssl_certificate     /etc/nginx/certs/partner.crt;
    ssl_certificate_key /etc/nginx/certs/partner.key;

    # 낡은 버전은 끈다. 공공 보안 점검에서 실제로 걸리는 항목이다.
    ssl_protocols TLSv1.2 TLSv1.3;

    # ---------- ② 클라이언트 검증 (2단계에서 주석을 푼다) ----------
    ssl_client_certificate /etc/nginx/certs/ca.crt;
    ssl_verify_client on;

    location / {
        # 뒷단 앱으로 넘긴다. 여기부터는 평문 http 다.
        proxy_pass http://partner:8000;

        # Host 헤더는 고정값으로 준다.
        # ($host 를 그대로 넘기면 리다이렉트 상황에서 오픈 리다이렉트가 될 수 있다)
        proxy_set_header Host partner;

        # ---------- ③ 우리가 누구인지 앱에 알려준다 (3단계에서 주석을 푼다) ----------
        proxy_set_header X-Client-DN     $ssl_client_s_dn;
        proxy_set_header X-Client-Verify $ssl_client_verify;
    }
}
